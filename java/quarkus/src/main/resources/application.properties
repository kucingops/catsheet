# =====================================================================
# catsheet :: Java 25 + Quarkus 3.40
# =====================================================================

# ---------- Storage: jpa (database) | memory (tanpa persistence) ----------
catsheet.storage=jpa

# ---------- Database: H2 in-memory supaya bisa jalan tanpa Docker ----------
# Di production ganti ke PostgreSQL: quarkus-jdbc-postgresql + datasource url.
# (Kalau datasource url dikosongkan dan Docker ada, Quarkus Dev Services otomatis nyalain DB.)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:catsheet;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# =====================================================================
# SECURITY: satu sumber user, empat cara login
# =====================================================================

# Sumber user: embedded di config (cuma buat demo!). Production: security-jpa / LDAP / OIDC.
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice123
quarkus.security.users.embedded.roles.alice=admin,user
quarkus.security.users.embedded.users.bob=bob123
quarkus.security.users.embedded.roles.bob=user

# 1) HTTP Basic: header "Authorization: Basic base64(user:pass)" di setiap request
quarkus.http.auth.basic=true

# 2) Form login: POST /j_security_check (j_username, j_password) -> cookie terenkripsi.
#    Quarkus tidak pakai HttpSession server-side; state login disimpan terenkripsi di cookie.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.session.encryption-key=catsheet-demo-encryption-key-ganti-di-prod

# 3) JWT Bearer (smallrye-jwt). Token didapat dari POST /api/auth/token
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://catsheet.dev
smallrye.jwt.sign.key.location=privateKey.pem
catsheet.jwt.issuer=https://catsheet.dev
catsheet.jwt.ttl=PT15M

# 4) API key custom (lihat security/ApiKey*.java)
catsheet.api-keys.report-bot.key=kunci-rahasia-bot
catsheet.api-keys.report-bot.roles=user
catsheet.api-keys.ops-admin.key=kunci-rahasia-ops
catsheet.api-keys.ops-admin.roles=admin,user

# ---------- Path -> mekanisme login yang boleh dipakai ----------
quarkus.http.auth.permission.basic.paths=/api/basic/*
quarkus.http.auth.permission.basic.policy=authenticated
quarkus.http.auth.permission.basic.auth-mechanism=basic

quarkus.http.auth.permission.form.paths=/api/form/*
quarkus.http.auth.permission.form.policy=authenticated
quarkus.http.auth.permission.form.auth-mechanism=form

quarkus.http.auth.permission.jwt.paths=/api/jwt/*
quarkus.http.auth.permission.jwt.policy=authenticated
quarkus.http.auth.permission.jwt.auth-mechanism=bearer

quarkus.http.auth.permission.key.paths=/api/key/*
quarkus.http.auth.permission.key.policy=authenticated
quarkus.http.auth.permission.key.auth-mechanism=apikey

# Path-specific mechanism butuh authentication dijalankan setelah path dicocokkan.
quarkus.http.auth.proactive=false
