spring.application.name=catsheet-spring-boot

# Pilih cara simpan data: memory | jdbc | jpa
catsheet.store=jpa

spring.datasource.url=jdbc:h2:mem:catsheet;DB_CLOSE_DELAY=-1
# Schema dibuat oleh schema.sql (dipakai bareng JDBC & JPA), Hibernate cuma validasi
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# Secret HMAC buat tanda tangan JWT (HS256). Di production: taruh di vault/env, minimal 32 byte.
catsheet.jwt.secret=ganti-ini-dengan-secret-panjang-minimal-32-byte!!
catsheet.jwt.ttl=PT15M
