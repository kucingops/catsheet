name: python

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [core, fastapi]
    defaults:
      run:
        working-directory: python/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/${{ matrix.project }}/uv.lock

      - name: Install Python 3.14 + dependencies
        run: uv sync --locked

      - name: Lint
        run: uvx ruff check .

      - name: Format
        run: uvx ruff format --check .

      - name: Test
        run: uv run pytest -q
