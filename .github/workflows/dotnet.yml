name: dotnet

on:
  push:
    branches: [main]
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet/aspnetcore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet/aspnetcore/global.json
      - run: dotnet test
