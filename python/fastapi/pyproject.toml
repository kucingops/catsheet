[project]
name = "python-fastapi-cheatsheet"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165",
    "sqlalchemy>=2.1",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.4",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=9.2", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
